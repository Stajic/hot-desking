ktor {
    deployment {
        # 0.0.0.0 a ne localhost: bez ovoga fizicki telefon na istoj Wi-Fi mrezi
        # ne moze da se poveze na server.
        port = 8080
        host = "0.0.0.0"
    }
    application {
        modules = [ rs.ftn.hotdesk.server.ApplicationKt.module ]
    }
}

storage {
    # --- PODRAZUMEVANO: H2 u fajlu ---
    # Nula instalacije, radi svuda, baza ostaje u ./build/hotdesk.mv.db.
    # Za bazu koja se brise pri svakom pokretanju: jdbc:h2:mem:hotdesk;DB_CLOSE_DELAY=-1
    #
    # Svaku vrednost pregazi promenljiva okruzenja istog smisla, ako je postavljena
    # (kao JWT_SECRET ispod). Bez njih server radi nad H2.
    driver   = "org.h2.Driver"
    driver   = ${?DB_DRIVER}
    jdbcUrl  = "jdbc:h2:file:./build/hotdesk;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
    jdbcUrl  = ${?DB_URL}
    user     = "sa"
    user     = ${?DB_USER}
    password = ""
    password = ${?DB_PASSWORD}

    # --- PostgreSQL (faza 4) ---
    # Ni ovaj fajl ni aplikativni kod se ne menjaju; postavljaju se promenljive
    # okruzenja, npr. u PowerShell-u:
    #
    #   $env:DB_DRIVER   = "org.postgresql.Driver"
    #   $env:DB_URL      = "jdbc:postgresql://localhost:5432/hotdesk"
    #   $env:DB_USER     = "postgres"
    #   $env:DB_PASSWORD = "<lozinka>"
    #
    # Drajver je vec u build-u (runtimeOnly u server/build.gradle.kts).
}

jwt {
    # RAZVOJNA vrednost. Repozitorijum je javan, pa ovde ne sme stajati prava tajna.
    # U stvarnom okruzenju se postavlja promenljiva okruzenja JWT_SECRET, koja
    # pregazi vrednost iz ovog fajla.
    secret        = "razvojna-tajna-ne-koristiti-u-produkciji"
    secret        = ${?JWT_SECRET}

    issuer        = "hot-desking"
    audience      = "hot-desking-klijenti"
    realm         = "hot-desking"

    # Dovoljno dugo da demonstracija ne pukne usred rada, dovoljno kratko
    # da token nije trajan.
    validityHours = 24
}
