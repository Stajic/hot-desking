ktor {
    deployment {
        # 0.0.0.0 a ne localhost: bez ovoga fizicki telefon na istoj Wi-Fi mrezi
        # ne moze da se poveze na server.
        port = 8080
        host = "0.0.0.0"
    }
    application {
        modules = [ rs.ftn.hotdesk.server.ApplicationKt.module ]
    }
}

storage {
    # --- PODRAZUMEVANO: H2 u fajlu ---
    # Nula instalacije, radi svuda, baza ostaje u ./build/hotdesk.mv.db.
    # Za bazu koja se brise pri svakom pokretanju: jdbc:h2:mem:hotdesk;DB_CLOSE_DELAY=-1
    driver   = "org.h2.Driver"
    jdbcUrl  = "jdbc:h2:file:./build/hotdesk;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
    user     = "sa"
    password = ""

    # --- PostgreSQL: odkomentarisati ova cetiri reda i zakomentarisati gornja ---
    # Nijedna linija aplikativnog koda se ne menja. Jedinstveni indeks nad
    # (resource_id, slot_start) radi identicno na obe baze.
    #
    # driver   = "org.postgresql.Driver"
    # jdbcUrl  = "jdbc:postgresql://localhost:5432/hotdesk"
    # user     = "postgres"
    # password = "postgres"
}
